apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app2
  template:
    metadata:
      labels:
        app: app2
    spec:
      containers:
        - name: app2
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: app2-html

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app2-html
  namespace: default
data:
  index.html: |
    <!DOCTYPE html> 
        <html> 
        <head> 
          <title>App 2</title> 
          <style>
              body {
              font-family: Arial, sans-serif;
              display: flex;
              justify-content: center;
              align-items: center;
              height: 100vh;
              margin: 0;
              background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
              color: white;
              }
              .container {
              text-align: center;
              padding: 50px;
              background: rgba(255, 255, 255, 0.15);
              border-radius: 20px;
              }
              h1 {
              font-size: 4em;
              } 
          </style> 
        </head>
      <body> 
        <div class="container"> 
          <h1>⚙️ Application 2</h1> 
          <p>Bienvenue sur app2.com</p> 
          <p>3 replicas actives</p> 
        </div> 
      </body> 
      </html>

---
apiVersion: v1
kind: Service
metadata:
  name: app2-service
  namespace: default
spec:
  selector:
    app: app2
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
